block.wi-d2-c2-surge-bridge-conveyor.name = Jembatan Konveyor Berbahan Paduan Logam
block.wi-d2-c2-surge-bridge-conveyor.description = Lebih baik dari Jembatan Konveyor Berbahan Titarium. Lebih cepat dengan jangkauan yang lebih luas.

block.wi-d2-c3-surge-bridge-conduit.name = Jembatan Saluran Berbahan Paduan Logam
block.wi-d2-c3-surge-bridge-conduit.description = Lebih baik dari Jembatan Saluran Berbahan Titarium. Lebih cepat dengan jangkauan yang lebih luas.

##Blocks-Crafter
block.wi-o1-resource-extractor.name = Pengestrak Sumber Daya Keras
block.wi-o1-resource-extractor.description = Mengebor dan Mengestrak sumber daya dari dalam Pasir menggunakan air dan tenaga.

block.wi-o2-extreme-resource-extractor.name = Pengestrak Sumber Daya Ekstrim
block.wi-o2-extreme-resource-extractor.description = Versi lebih lanjut dari Pengestrak Sumber Daya Keras. Dengan kecepatan dan efisiensi tinggi, namun membutuhkan air dan tenaga yang lebih banyak.

block.wi-o3-massive-resource-extractor.name = Pengestrak Sumber Daya Massif Raksasa
block.wi-o3-massive-resource-extractor.description = Tingkat akhir dari Pengestrak Sumber Daya Ekstrim. Dengan kecepatan dan efisiensi yang sangat tinggi, namun membutuhkan air dan tenaga yang sangat banyak.

block.wi-sigraph-mixer.name = Pencampur Silgraf
block.wi-sigraph-mixer.description = Mencampurkan Silikon dan Grafit menjadi Silgraf.

block.wi-titarium-mixer.name = Pencampur Titarium
block.wi-titarium-mixer.description = Mencampurkan Titanium dan Torium menjadi Titarium.

block.wi-b1-al1-reinforced-alloy-smelter.name = Pelebur logam yang Diperkuat
block.wi-b1-al1-reinforced-alloy-smelter.description = Versi yang diperkuat dari Pelebur Paduan Logam. Pelebur logam ini bekerja dengan efisiensi yang lebih baik daripada Pelebur Paduan Logam. Menggunakan Pyratite untuk mempercepat pemanasan dan peleburan.

