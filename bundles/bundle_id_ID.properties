block.wi-d1-c1-titarium-conveyor.name = Konveyor Berbahan Titarium
block.wi-d1-c1-titarium-conveyor.description = Memindahkan barang ke depan. Lebih cepat dan memiliki ketahanan yang kuat.

block.wi-d1-c2-titarium-bridge-conveyor.name = Jembatan Konveyor Berbahan Titarium
block.wi-d1-c2-titarium-bridge-conveyor.description = Lebih baik daripada Jembatan Konveyor konvensional. Cepat dengan jangkauan yang luas.

block.wi-d1-c3-titarium-bridge-conduit.name = Jembatan Saluran Berbahan Titarium
block.wi-d1-c3-titarium-bridge-conduit.description =  Lebih baik daripada Jembatan Saluran konvensional. Cepat dengan jangkauan yang luas.

block.wi-d2-c1-surge-conveyor.name = Konveyor Berbahan Paduan Logam
