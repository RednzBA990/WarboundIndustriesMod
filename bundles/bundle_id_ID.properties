item.wi-sigraph.description = Silgraf adalah penggabungan antara Silikon dan Grafit. Digunakan untuk bahan pembuatan Unit modern, bahan konstruksi, dan bahan untuk membuat sumber daya lain.

item.wi-titarium.name = Titarium
item.wi-titarium.description = Titarium (Titanium dan Torium). Digunakan untuk bahan pembuatan Unit modern, bahan konstruksi, dan bahan untuk membuat sumber daya lain.

item.wi-core-alloy.name = Paduan Inti
item.wi-core-alloy.description = Tanpa deskripsi

