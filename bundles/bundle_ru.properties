##Blocks
block.wi-copper-cargo-delivery-load.name = Медная Точка Погрузки Дронов
block.wi-copper-cargo-delivery-load.description = Создаёт одного дрона на точку. Дрон будет автоматически переносить предметы из этой точки в разгрузочную. Для работы необходимо установить фильтр предметов в точке разгрузки.

block.wi-copper-cargo-delivery-unload.name = Медная Точка Разгрузки Дронов
block.wi-copper-cargo-delivery-unload.description = Точка, где дрон привозит и разгружает ресурсы. Дроны будут доставлять сюда ресурсы только если установлен фильтр.

block.wi-faster-cargo-delivery-load.name = Быстрая Точка Погрузки Дронов
block.wi-faster-cargo-delivery-load.description = Создаёт одного улучшенного дрона на точку. Дрон будет автоматически переносить предметы из этой точки в разгрузочную. Для работы необходимо установить фильтр предметов в точке разгрузки.

block.wi-faster-cargo-delivery-unload.name = Продвинутая Точка Разгрузки Дронов
block.wi-faster-cargo-delivery-unload.description = Точка, где дрон привозит и разгружает ресурсы. Дроны будут доставлять сюда ресурсы только если установлен фильтр.

##Block-UnitFactories
block.wi-support-unit-factory.name = Фабрика Поддержки
block.wi-support-unit-factory.description = Производит единицы поддержки которые помогут в строительстве и не только.

block.wi-support-unit-factory2-reconstructor-additive.name = Добавляющий Реконструктор Юнитов Поддержки
block.wi-support-unit-factory2-reconstructor-additive.description = Улучшает введённые единицы поддержки до второго уровня.

block.wi-factory-unit-modern.name = Современная Фабрика
block.wi-factory-unit-modern.description = Производит базовые танки и вертолёты.

block.wi-factory-unit2-modern-reconstructor-aditive.name = Современный Добавляющий Реконструктор
block.wi-factory-unit2-modern-reconstructor-aditive.description = Улучшает введённые современные единицы до второго уровня.

block.wi-factory-unit2-modern-reconstructor-multiplicative.name = Современный Умножающий Реконструктор
block.wi-factory-unit2-modern-reconstructor-multiplicative.description = Улучшает введённые современные единицы до третьего уровня.

##Block-Distribution
block.wi-d0-c1-unloader.name = Титанориевый Разгрузщик
block.wi-d0-c1-unloader.description = Ускоренный разгрузщик. Лучше обычного разгрузщика.

block.wi-d1-c1-titarium-conveyor.name = Титанориевый Конвейер
block.wi-d1-c1-titarium-conveyor.description = Ускоренный конвейер. Быстрее и прочнее.

block.wi-d1-c2-titarium-bridge-conveyor.name = Титанориевый Мостовой Конвейер
block.wi-d1-c2-titarium-bridge-conveyor.description = Лучше обычного мостового конвейера. Быстрее и с большей дальностью.

block.wi-d1-c3-titarium-bridge-conduit.name = Титанориевый Мостовой Трубопровод
block.wi-d1-c3-titarium-bridge-conduit.description = Лучше обычного мостового трубопровода. Быстрее и с большей дальностью.

block.wi-d0-c2-unloader.name = Кинетический Разгрузщик
block.wi-d0-c2-unloader.description = Быстрейший разгрузщик. Лучше Титанориевого Разгрузщика.

block.wi-d2-c1-surge-conveyor.name = Кинетический Конвейер
block.wi-d2-c1-surge-conveyor.description = Быстрейший конвейер. Лучше Титанориевого Конвейера. Гораздо быстрее и прочнее.

block.wi-d2-c2-surge-bridge-conveyor.name = Кинетический Мостовой Конвейер
block.wi-d2-c2-surge-bridge-conveyor.description = Продвинутая версия Титанориевого Мостового Конвейера. Ещё быстрее и больше дальности.

block.wi-d2-c3-surge-bridge-conduit.name = Кинетический Мостовой Трубопровод
block.wi-d2-c3-surge-bridge-conduit.description = Продвинутая версия Титанориевого Мостового Трубопровода. Ещё быстрее и больше дальности.

block.wi-l1-a1-liquid-unloader.name = Односторонний Разгрузщик Жидкостей
block.wi-l1-a1-liquid-unloader.description = Разгружает жидкости с заднего блока в передний. Односторонний, берёт сзади и отдаёт вперёд.

block.wi-d3-a1-hybrid-junction.name = Гибридный Перекрёсток
block.wi-d3-a1-hybrid-junction.description = Перекрёсток, который может проводить предметы и жидкости одновременно.

##Blocks-Crafter
block.wi-sigraph-mixer.name = Карбоносиликатная Плавильня
block.wi-sigraph-mixer.description = Соединяет кремний и графит в Карбоносиликат.

block.wi-titarium-mixer.name = Титанориевая Плавильня
block.wi-titarium-mixer.description = Соединяет титан и торий в Титанорий.

block.wi-o1-resource-extractor.name = Тяжёлый Экстрактор Ресурсов
block.wi-o1-resource-extractor.description = Добывает и извлекает ресурсы из песка используя воду и энергию.

block.wi-o2-extreme-resource-extractor.name = Экстремальный Экстрактор Ресурсов
block.wi-o2-extreme-resource-extractor.description = Продвинутая версия Тяжёлого Экстрактора Ресурсов. Быстрее и эффективнее, но требует больше воды и энергии.

block.wi-o3-massive-resource-extractor.name = Огромный Экстрактор Ресурсов
block.wi-o3-massive-resource-extractor.description = Совершенный уровень Экстремального Экстрактора Ресурсов. С невероятной скоростью и эффективностью требует очень много воды и энергии.

block.wi-c-a1-liquid-packager.name = Упаковщик Жидкостей
block.wi-c-a1-liquid-packager.description = Упаковывает жидкости в предметы. Одна упаковка содержит 50 единиц жидкости. The liquid input and output are listed below in order.
block.wi-c-a1-liquid-packager.details = Может упаковывать не только один тип жидкости.
block.wi-c-a2-liquid-unpacker.name = Разпаковщик Жидкостей
block.wi-c-a2-liquid-unpacker.description = Одна упаковка содержит 50 единиц жидкости.
block.wi-c-a2-liquid-unpacker.details = Может разпаковывать не только один тип жидкости.

block.wi-b1-1-advanced-plastanium-compressor.name = Продвинутый Пластановый Компрессор
block.wi-b1-1-advanced-plastanium-compressor.description = Лучше, чем Пластановый Компрессор. Производит быстрее и эффективнее.

block.wi-b1-2-advanced-phase-weaver.name = Продвинутый Фазовый Ткач
block.wi-b1-2-advanced-phase-weaver.description = Лучше, чем Фазовый Ткач. Производит быстрее и эффективнее.

block.wi-b1-al1-reinforced-alloy-smelter.name = Укреплённая Плавильня Кинетического Сплава
block.wi-b1-al1-reinforced-alloy-smelter.description = Укреплённая версия Плавильня Кинетического Сплава. Эффективнее стандартного аналога. Использует пиротит для ускорения плавления.

##Blocks-Power
block.wi-p1-a-water-generator-1.name = Гидроэлектро Генератор
block.wi-p1-a-water-generator-1.description = Конвертирует кинетическую и потенциальную энергию воды в электрическую энергию. Использует поток воды для вращения турбины.

##Blocks-Turret
block.wi-t1-a-quad-turret.name = Повторитель
block.wi-t1-a-quad-turret.description = Стреляет тяжёлыми снарядами по вражеским целям.

##Blocks-Drill
block.wi-drill1-a-titarium-drill.name = Титанориевый Бур
block.wi-drill1-a-titarium-drill.description = Лучше, чем Пмевматический Бур. Может добывать торий.

block.wi-drill1-b-surge-drill.name = Кинетический Бур
block.wi-drill1-b-surge-drill.description = Лучше, чем Титанориевый Бур. Добывает с выссшей эффективностью. Требует энергию.

##Blocks-Production
block.wi-pro1-a-advanced-water-extractor.name = Продвинутый Гидронасос
block.wi-pro1-a-advanced-water-extractor.description = Продвинутая версия Гидронасоса. Эффективнее.

block.wi-pro2-a-cryofluid-extractor.name = Креонасос
block.wi-pro2-a-cryofluid-extractor.description = Выкачивает подземные воды и смешивает с титаном для производста Креогенной Жидкости.

##Tech
block.wi-tech-wi.description = Для начала нового дерева технологий.

##Units
unit.wi-caero.name = Каеро
unit.wi-caero.description = Базовые дроны доставки. Медленно доставляет предметы в маленьких количествах, но очень дешёвый.

unit.wi-surg.name = Кинет
unit.wi-surg.description = Ускоренные дроны доставки. Доставляет предметы быстрее и в больших количествах.

unit.wi-node.name = Узел
unit.wi-node.description = Помогает в строительстве и добывает руду.

unit.wi-nold.name = Нолд
unit.wi-nold.description = Улучшенная версия единицы поддержки Узел. Ремонтирует повреждённые постройки и юнитов.

unit.wi-tankt1-axion.name = Аксион
unit.wi-tankt1-axion.description = Базовый танк Серпуло. Стреляет стандартными снарядами и пулями по вражеским целям.

unit.wi-tankt2-aziot.name = Азиот
unit.wi-tankt2-aziot.description = Танк второго уровня, основанный на танке Аксион. Стреляет снарядами и залпами пуль по вражеским целям.

unit.wi-tankt3-azoph.name = Азоф
unit.wi-tankt3-azoph.description = Стреляет тяжёлыми снарядами, залпами пуль и ракет по вражеским целям.

unit.wi-helit1-raptor.name = Раптор
unit.wi-helit1-raptor.description = Базовый вертолёт Серпуло. Стреляет стандартными пулями и ракетами по вражеским целям.

unit.wi-helit2-rapier.name = Рапира
unit.wi-helit2-rapier.description = Стреляет залпами пуль и ракет по вражеским целям.

unit.wi-helit3-razor.name = Лезвие
unit.wi-helit3-razor.description = Стреляет двумя пробивающими лазерами, залпами пуль и ракетами по вражеским целям.

