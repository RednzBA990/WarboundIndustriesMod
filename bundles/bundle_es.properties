##Blocks
block.wi-copper-cargo-delivery-load.name = Punto de Carga de Drones de Cobre
block.wi-copper-cargo-delivery-load.description = Genera un dron por punto. El dron transportará automáticamente los objetos desde este punto hasta el punto de descarga. Para que funcione, debes establecer un filtro de objetos en el punto de descarga.

block.wi-copper-cargo-delivery-unload.name = Punto de Descarga de Drones de Cobre
block.wi-copper-cargo-delivery-unload.description =  El punto donde el dron transporta y deja los objetos. Al filtrar los objetos en este punto, el dron puede funcionar.

block.wi-d1-a1-packaged-liquid-cargo-delivery-unload.name = Punto de Descarga de Drones de Líquidos
block.wi-d1-a1-packaged-liquid-cargo-delivery-unload.description = El punto donde el dron transporta y descarga líquidos. Filtrar los objetos en este punto permite que el dron funcione.

block.wi-d1-a1-packaged-liquid-cargo-delivery-load.name = Punto de Carga de Drones de Líquidos
block.wi-d1-a1-packaged-liquid-cargo-delivery-load.description = Crea un dron por punto. El dron transportará automáticamente los líquidos desde este punto hasta el punto de descarga. Solo un tipo de líquido por bloque.

block.wi-faster-cargo-delivery-load.name = Punto de Carga de Drones Rápidos
block.wi-faster-cargo-delivery-load.description = Crea un dron por punto. El dron transportará automáticamente los objetos desde este punto hasta el punto de descarga. Para que esto funcione, debes proporcionar un filtro de objetos en el punto de descarga para que los transporte.

block.wi-faster-cargo-delivery-unload.name = Punto Avanzado de Descarga de Drones
block.wi-faster-cargo-delivery-unload.description = El punto en el que el dron transporta y deja los objetos. Al filtrar los objetos en este punto, el dron puede funcionar.

##Block-UnitFactories
block.wi-support-unit-factory.name = Fábrica de Unidades de Apoyo
block.wi-support-unit-factory.description = Esta fábrica produce unidades de apoyo que te ayudarán en la construcción.

block.wi-support-unit-factory2-reconstructor-additive.name = Reconstructor Aditivo de Unidades de Apoyo
block.wi-support-unit-factory2-reconstructor-additive.description = Mejora las unidades de apoyo al segundo nivel.

block.wi-factory-unit-modern.name = Fábrica de Unidades Modernas
block.wi-factory-unit-modern.description = Utilizada para crear tanques y helicópteros básicos.

block.wi-factory-unit2-modern-reconstructor-aditive.name = Reconstructor Aditivo Moderno
block.wi-factory-unit2-modern-reconstructor-aditive.description = Mejora las unidades modernas al segundo nivel.

block.wi-factory-unit2-modern-reconstructor-multiplicative.name = Reconstructor Multiplicativo Moderno
block.wi-factory-unit2-modern-reconstructor-multiplicative.description = Mejora las unidades modernas al tercer nivel.

block.wi-factory-unit2-modern-reconstructor2-exponential.name = Reconstructor Exponencial Moderno
block.wi-factory-unit2-modern-reconstructor2-exponential.description = Mejora las unidades modernas al cuarto nivel.\n[accent]Lista de Recetas[]\n[orange] Aztroxh[] requiere 3 Tanques [accent]Aziot[], 6 [accent]Muros Grandes de Titanorium[].\n[orange] Opva[] requiere 2 Helicópteros [accent]Arier[], 4 [accent]Muros Grandes de Titanorium[].

##Block-Distribution
block.wi-d0-c1-unloader.name = Descargador de Titanorium
block.wi-d0-c1-unloader.description = El descargador más rápido. Superior al Descargador normal.

block.wi-d1-c1-titarium-conveyor.name = Cinta Transportadora de Titanorium
block.wi-d1-c1-titarium-conveyor.description = La cinta transportadora más rápida. Versión avanzada, con alta velocidad y blindaje pesado.

block.wi-d1-c2-titarium-bridge-conveyor.name = Puente de Cinta Transportadora de Titanorium
block.wi-d1-c2-titarium-bridge-conveyor.description = Superior a la Cinta Puente convencional. Más rápida y con mayor alcance.

block.wi-d1-c3-titarium-bridge-conduit.name = Tubería Puente de Titanorium
block.wi-d1-c3-titarium-bridge-conduit.description = Superior al Conducto Puente convencional. Más rápido y con mayor alcance.

block.wi-d1-c2-titanorium-junction.name = Cruce de titanorium
block.wi-d1-c2-titanorium-junction.description = actua como puente puente para dos cintas que se cruzan.

block.wi-d1-c2-titanorium-router.name = Enrutador de titanorium
block.wi-d1-c2-titanorium-router.description = Distribuye objetos de forma equitativa en tres direcciones.

block.wi-d0-c2-unloader.name = Descargador de Aleación Eléctrica
block.wi-d0-c2-unloader.description = Descargador de altísima velocidad. Superior al Descargador de Titanorium.

block.wi-d2-c1-surge-conveyor.name = Cinta Transportadora de Aleación Eléctrica
block.wi-d2-c1-surge-conveyor.description = La cinta transportadora de mayor velocidad. Superior a la de Titanorium. Velocidad muy elevada y blindaje pesado.

block.wi-d2-c2-surge-bridge-conveyor.name = Puente de Cinta de Aleación Eléctrica
block.wi-d2-c2-surge-bridge-conveyor.description = Versión avanzada de la Cinta Puente de Titanorium. Más rápida y con mayor alcance.

block.wi-d2-c1-surge-junction.name = Cruce de Aleación Eléctrica
block.wi-d2-c1-surge-junction.description = Actúa como puente entre dos cintas que se cruzan.

block.wi-d2-c1-surge-router.name = Enrutador de Aleación Eléctrica
block.wi-d2-c1-surge-router.description = Distribuye objetos de forma equitativa en tres direcciones.

block.wi-d2-c3-surge-bridge-conduit.name = Conducto de Aleación Eléctrica
block.wi-d2-c3-surge-bridge-conduit.description = Versión avanzada del Conducto Puente de Titanorium. Más rápido y con mayor alcance.

block.wi-l1-a1-liquid-unloader.name = Descargador de Líquidos Unidireccional
block.wi-l1-a1-liquid-unloader.description = Descarga el fluido del bloque situado detrás y lo transfiere hacia la parte delantera. Solo en una dirección: parte trasera (entrada) y parte delantera (salida).

block.wi-d3-a1-hybrid-junction.name = Cruce Híbrido
block.wi-d3-a1-hybrid-junction.description = Un cruce por el que pueden pasar objetos y líquidos simultáneamente.

##Blocks-Crafter
block.wi-sigraph-mixer.name = Fundición  de Carbosilite
block.wi-sigraph-mixer.description = Funde Silicio y Grafito para producir Carbosilite.

block.wi-titarium-mixer.name = Fundición de Titanorium
block.wi-titarium-mixer.description = Funde Titanio y Torio para producir Titanorium.

block.wi-o1-resource-extractor.name = Extractor de Recursos Pesado
block.wi-o1-resource-extractor.description = Perfora y extrae recursos del interior de la arena utilizando agua y energía.

block.wi-o2-extreme-resource-extractor.name = Extractor de Recursos Extremo
block.wi-o2-extreme-resource-extractor.description = Versión avanzada del Extractor de Recursos Pesado. Mayor velocidad y eficiencia, pero requiere más agua y energía.

block.wi-o3-massive-resource-extractor.name = Extractor de Recursos Masivo
block.wi-o3-massive-resource-extractor.description = El nivel máximo del Extractor de Recursos Extremo. Velocidad y eficiencia increíblemente altas, pero requiere cantidades enormes de agua y energía.

block.wi-c-a1-liquid-packager.name = Empaquetador de Líquidos
block.wi-c-a1-liquid-packager.description = Empaqueta líquidos en objetos portátiles. 1 objeto contiene 50 unidades de líquido. Las entradas de líquido y salidas de objetos se listan a continuación en orden.
block.wi-c-a1-liquid-packager.details = Puede empaquetar más de 1 tipo de líquido.

block.wi-c-a2-liquid-unpacker.name = Desempaquetador de Líquidos
block.wi-c-a2-liquid-unpacker.description = 1 objeto contiene 50 unidades de líquido.
block.wi-c-a2-liquid-unpacker.details = Puede desempaquetar más de 1 tipo de líquido.

block.wi-b1-1-advanced-plastanium-compressor.name = Compresor Avanzado de Plastanio
block.wi-b1-1-advanced-plastanium-compressor.description = Mejor que el compresor de plastanio. Produce de forma rápida y eficiente.

block.wi-b1-2-advanced-phase-weaver.name = Tejedor de Fase Avanzado
block.wi-b1-2-advanced-phase-weaver.description = Mejor que el tejedor de fase. Produce de forma rápida y eficiente.

block.wi-b1-al1-reinforced-alloy-smelter.name = Fundidor de Aleación Reforzado
block.wi-b1-al1-reinforced-alloy-smelter.description = Una versión reforzada del fundidor de aleación normal. Este fundidor funciona con mayor eficiencia que el fundidor de aleación. Utiliza piratita para acelerar el calentamiento y la fusión.

##Blocks-Power
block.wi-p1-a-water-generator-1.name = Generador Hidroeléctrico
block.wi-p1-a-water-generator-1.description = Convierte la energía cinética y potencial del agua en energía eléctrica. Aprovecha el flujo del agua para girar una turbina.

##Blocks-Turret
block.wi-t1-a-quad-turret.name = Repeater
block.wi-t1-a-quad-turret.description = Dispara proyectiles pesados al enemigo.

##Blocks-Drill
block.wi-drill1-a-titarium-drill.name = Taladro de Titanorium
block.wi-drill1-a-titarium-drill.description = Superior a la Perforadora Neumática. Puede extraer torio.

block.wi-drill1-b-surge-drill.name = Taladro de Aleación Eléctrica
block.wi-drill1-b-surge-drill.description = Superior a la Perforadora de Titanorium. Perfora con alta eficiencia. Requiere energía para operar.

##Blocks-Production
block.wi-pro1-a-advanced-water-extractor.name = Extractor de Agua Avanzado
block.wi-pro1-a-advanced-water-extractor.description = Versión avanzada del Extractor de Agua. Mejor y más eficiente.

block.wi-pro2-a-cryofluid-extractor.name = Extractor de Criofluido
block.wi-pro2-a-cryofluid-extractor.description = Extrae agua y la mezcla con titanio para producir Criofluido.

block.wi-pro3-a1-material-press.name = Compresor de Materiales
block.wi-pro3-a1-material-press.description = Comprime los recursos que se encuentran debajo de este bloque para convertirlos en material rico en minerales.

block.wi-pro3-a2-minerial-extractor.name = Extractor de Minerial
block.wi-pro3-a2-minerial-extractor.description = Un extractor especializado que procesa el suelo para obtener Minerial. Requiere energía constante.

##Blocks-Wall
block.wi-w-w1-titarium-wall-small.name = Muro de Titanorium
block.wi-w-w1-titarium-wall-small.description = Protege los edificios de los proyectiles enemigos. Fuertemente blindado.

block.wi-w-w2-titarium-wall-large.name = Muro Grande de Titanorium
block.wi-w-w2-titarium-wall-large.description = Protege los edificios de los proyectiles enemigos. Fuertemente blindado.

##Tech
block.wi-tech-wi.description = Para iniciar una nueva rama tecnológica desde aquí.

##Units
unit.wi-caero.name = Caero
unit.wi-caero.description = Drones de entrega básicos. Transportan objetos con poca capacidad y baja velocidad, pero son económicos de producir.

unit.wi-surg.name = Surg
unit.wi-surg.description = Drones de entrega rápidos. Transportan objetos con alta capacidad y velocidad.

unit.wi-node.name = Node
unit.wi-node.description = Este dron te ayudará en la construcción de edificios y en la extracción de minerales.

unit.wi-nold.name = Nold
unit.wi-nold.description = Segunda versión de la unidad de apoyo Node. Puede reparar edificios y unidades cercanas.

unit.wi-nosr.name = Nosr
unit.wi-nosr.description = Tercera versión de la unidad de apoyo Nold. Puede reparar edificios y unidades cercanas, y aplicar el efecto Reparación Débil a las unidades próximas durante 30 segundos.

unit.wi-tankt1-axion.description = Tanque base de Serpulo. Dispara proyectiles básicos al enemigo de manera alternada.
unit.wi-tankt2-aziot.description = Tanque de Serpulo de segundo nivel basado en el Axion. Dispara ráfagas de proyectiles pesados al enemigo.
unit.wi-tankt3-azoph.description = Dispara ráfagas de proyectiles pesados, proyectiles básicos y misiles al enemigo.
unit.wi-tankt4-aztroxh.description = Dispara proyectiles pesados contra los enemigos con sus tres cañones principales. Un tanque de artillería con un largo alcance de disparo. Vulnerable a los ataques aéreos.

unit.wi-helit1-raptor.description = Helicóptero básico de Serpulo. Dispara balas básicas contra los enemigos.
unit.wi-helit2-rapier.description = Dispara ráfagas de proyectiles y misiles al enemigo.
unit.wi-helit3-razor.description = Dispara una lluvia de balas y misiles contra el enemigo. Vulnerable a los ataques aéreos.
unit.wi-helit4-opva.description = Dispara una lluvia de proyectiles pesados y misiles contra el enemigo.

